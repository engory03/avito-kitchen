services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kitchen
      POSTGRES_PASSWORD: kitchen
      POSTGRES_DB: kitchen
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kitchen -d kitchen"]
      interval: 5s
      timeout: 5s
      retries: 10

  kitchen-api:
    build:
      context: .
      dockerfile: Dockerfile.kitchen
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://kitchen:kitchen@postgres:5432/kitchen?sslmode=disable
      PARTNER_API_KEY: demo-partner-key
      PARTNER_BASE_URL: http://partner-demo:8081
      RESERVATION_TTL_MINUTES: "10"
      CONFIRM_TIMEOUT_MINUTES: "15"
      PARTNER_HTTP_TIMEOUT_MS: "2000"
      REDIS_ADDR: redis:6379
      CATALOG_CACHE_TTL_SECONDS: "120"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  partner-demo:
    build:
      context: .
      dockerfile: Dockerfile.partner
    environment:
      HTTP_ADDR: ":8081"
      KITCHEN_BASE_URL: http://kitchen-api:8080
      PARTNER_API_KEY: demo-partner-key
      PARTNER_PUBLIC_URL: http://partner-demo:8081
    ports:
      - "8081:8081"
    depends_on:
      - kitchen-api

volumes:
  pgdata:
