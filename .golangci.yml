run:
  timeout: 3m
  tests: true
  skip-dirs:
    - docs/swagger

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell

linters-settings:
  goimports:
    local-prefixes: github.com/engory03/avito-kitchen

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
